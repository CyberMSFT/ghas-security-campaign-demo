version: 2
updates:
  # npm/yarn
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
    open-pull-requests-limit: 10
    reviewers:
      - "CyberMSFT"
    labels:
      - "dependencies"
      - "security"
    allow:
      - dependency-type: "direct"
    commit-message:
      prefix: "chore:"
      include: "scope"
